<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FCT CIAM - Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --fct-blue:#0b4b7f;
      --navy:#141d3a;
      --text:#1a2936;
      --muted:#566b7f;
      --border:#aeb8c2;
      --line:#d8dfe5;
      --link:#006eaa;
      --bg:#ffffff;
      --focus:#005a9e;
      --error:#ac0d1f;
    }
    *{box-sizing:border-box}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Barlow",sans-serif;
      color:var(--text);
      background:var(--bg);
      display:grid;
      grid-template-rows:78px 1fr 38px;
      min-height:100vh;
    }
    header{
      background:var(--fct-blue);
      display:flex;
      align-items:center;
      padding:0 28px;
    }
    .brand{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:#fff;
      text-decoration:none;
      font-size:31px;
      font-style:italic;
      font-weight:700;
      letter-spacing:-1px;
    }
    .brand-mark{
      width:25px;
      height:30px;
      position:relative;
      display:inline-block;
    }
    .brand-mark:before,
    .brand-mark:after{
      content:"";
      position:absolute;
      background:#fff;
      transform:rotate(45deg);
      border-radius:1px;
    }
    .brand-mark:before{width:21px;height:7px;left:3px;top:10px}
    .brand-mark:after{width:7px;height:21px;left:10px;top:3px}

    main{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:44px 24px 54px;
      background:#fff;
    }
    .signin-shell{
      width:min(100%, 520px);
      text-align:left;
      border:1px solid #c7ced8;
      padding:40px 36px;
      background:#fff;
    }
    .product-name{
      font-size:17px;
      font-weight:500;
      margin:0 0 18px;
      letter-spacing:.1px;
    }
    h1{
      font-size:33px;
      line-height:1.1;
      margin:0 0 20px;
      font-weight:700;
      color:#111820;
    }
    .intro{
      margin:0 0 18px;
      color:var(--muted);
      font-size:16px;
      line-height:1.5;
    }
    label{
      display:block;
      font-size:15px;
      font-weight:500;
      margin:0 0 8px;
      color:#304a65;
    }
    input{
      width:100%;
      height:48px;
      border:1px solid #c7ced8;
      border-radius:0;
      padding:0 14px;
      font:inherit;
      font-size:16px;
      color:#1a2936;
      background-color:#fff;
      caret-color:#1a2936;
      outline:none;
      transition:border-color .15s, box-shadow .15s;
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active{
      -webkit-text-fill-color:#1a2936 !important;
      -webkit-box-shadow:0 0 0 1000px #fff inset !important;
      box-shadow:0 0 0 1000px #fff inset !important;
      transition:background-color 9999s ease-in-out 0s;
    }
    input::placeholder{color:#747e87}
    input:focus{
      border-color:var(--focus);
      box-shadow:0 0 0 2px rgba(0,90,158,.14);
    }
    .field{margin-bottom:18px}
    .error{
      display:none;
      color:var(--error);
      font-size:14px;
      margin-top:8px;
    }
    .error.show{display:block}
    .below-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-top:8px;
    }
    .create-link{
      color:var(--link);
      text-decoration:underline;
      font-size:15px;
      font-weight:500;
      cursor:pointer;
      background:none;
      border:0;
      padding:0;
      font-family:inherit;
    }
    .primary{
      min-width:112px;
      height:48px;
      border:none;
      border-radius:3px;
      background:var(--navy);
      color:#fff;
      font-family:inherit;
      font-size:16px;
      font-weight:600;
      padding:0 24px;
      cursor:pointer;
    }
    .primary:hover{filter:brightness(1.08)}
    .primary:focus-visible,.create-link:focus-visible,.footer-link:focus-visible{
      outline:3px solid rgba(0,90,158,.25);
      outline-offset:3px;
    }
    .divider{
      height:1px;
      background:var(--line);
      width:100%;
      margin-top:48px;
    }
    .password-wrap{display:none}
    .password-wrap.show{display:block}
    .mfa-step{display:none}
    .mfa-step.show{display:block}
    .mfa-option{
      width:100%;
      min-height:66px;
      display:flex;
      align-items:center;
      gap:20px;
      border:1px dashed #3c4650;
      background:#f2f2f2;
      color:#1a1a1a;
      padding:14px 20px;
      font:inherit;
      font-size:16px;
      text-align:left;
      cursor:pointer;
    }
    .mfa-option:hover{background:#e9e9e9}
    .mfa-option:focus-visible{outline:3px solid rgba(0,90,158,.25);outline-offset:3px}
    .envelope-icon{
      width:32px;
      height:22px;
      border:2px solid #4b4b4b;
      position:relative;
      flex:0 0 auto;
    }
    .envelope-icon:before,
    .envelope-icon:after{
      content:"";
      position:absolute;
      top:3px;
      width:18px;
      height:2px;
      background:#4b4b4b;
    }
    .envelope-icon:before{left:0;transform:rotate(31deg)}
    .envelope-icon:after{right:0;transform:rotate(-31deg)}
    .mfa-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:28px;
    }
    .mfa-actions .secondary,
    .mfa-actions .primary{height:42px;min-width:108px}
    .mfa-code-field{margin-top:4px}
    .mfa-code-field input{
      height:42px;
      padding:0;
      border:0;
      border-bottom:2px solid #0078d4;
      box-shadow:none;
    }
    .mfa-code-field input:focus{border-color:#005a9e;box-shadow:none}
    .actions-password{
      display:flex;
      justify-content:flex-end;
      margin-top:6px;
    }
    .back-link{
      color:var(--link);
      border:0;
      background:none;
      padding:0;
      font:inherit;
      text-decoration:underline;
      cursor:pointer;
      margin-right:auto;
    }
    .stay-signed-in-step{display:none}
    .stay-signed-in-step.show{display:block}
    .stay-signed-in-step h2{
      margin:0 0 10px;
      font-size:28px;
      line-height:1.15;
      color:#111820;
      font-weight:700;
    }
    .stay-signed-in-step .intro{margin-bottom:24px;}
    .checkbox-row{
      display:flex;
      align-items:center;
      gap:10px;
      margin:6px 0 28px;
      color:#304a65;
      font-size:15px;
    }
    .checkbox-row input{
      width:18px;
      height:18px;
      padding:0;
      margin:0;
      accent-color:var(--navy);
    }
    .stay-actions{
      display:flex;
      justify-content:flex-end;
      gap:12px;
    }
    .secondary{
      min-width:96px;
      height:48px;
      border:1px solid #c7ced8;
      border-radius:3px;
      background:#fff;
      color:var(--navy);
      font-family:inherit;
      font-size:16px;
      font-weight:600;
      padding:0 24px;
      cursor:pointer;
    }
    .secondary:hover{background:#f5f7f9}
    .mock-note{
      display:none;
      margin-top:16px;
      padding:12px 14px;
      background:#f5f7f9;
      border-left:3px solid var(--fct-blue);
      color:#304a65;
      font-size:14px;
      line-height:1.45;
    }
    .mock-note.show{display:block}
    footer{
      background:var(--fct-blue);
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:26px;
      padding:0 26px;
    }
    .footer-link{
      color:#fff;
      font-size:13px;
      text-decoration:underline;
      cursor:pointer;
      background:none;
      border:0;
      font-family:inherit;
      padding:0;
    }
    .ellipsis{
      color:#fff;
      font-size:19px;
      letter-spacing:3px;
      transform:translateY(-2px);
    }
    @media (max-width:640px){
      body{grid-template-rows:68px 1fr 44px}
      header{padding:0 20px}
      .brand{font-size:27px}
      main{padding:34px 20px 42px;align-items:flex-start}
      .signin-shell{margin-top:8vh;padding:32px 24px}
      h1{font-size:30px}
      .below-row{align-items:flex-end}
      footer{justify-content:center;padding:0 16px;gap:18px}
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="brand" aria-label="FCT home" onclick="return false;">
      <span class="brand-mark" aria-hidden="true"></span><span>FCT</span>
    </a>
  </header>

  <main>
    <section class="signin-shell" aria-labelledby="signin-title">
      <p class="product-name">FCTCIAM</p>
      <h1 id="signin-title">Sign in</h1>
      <p class="intro">Sign in to access fctciam</p>

      <div id="emailStep">
        <div class="field">
          <label for="email">Work email</label>
          <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="Enter email address" aria-describedby="emailError" />
          <div id="emailError" class="error">Enter a valid work email to continue.</div>
        </div>

        <div class="below-row">
          <button type="button" class="create-link" id="createAccount">No account? Create one</button>
          <button type="button" class="primary" id="nextBtn">Next</button>
        </div>
      </div>

      <div id="passwordStep" class="password-wrap">
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter Password" />
          <div id="passwordError" class="error">Enter your password to continue.</div>
        </div>
        <div class="actions-password">
          <button type="button" class="back-link" id="backBtn">Back</button>
          <button type="button" class="primary" id="signInBtn">Sign in</button>
        </div>
      </div>

      <div id="mfaMethodStep" class="mfa-step">
        <button type="button" class="mfa-option" id="emailCodeBtn">
          <span class="envelope-icon" aria-hidden="true"></span>
          <span id="emailCodeText">Email code</span>
        </button>
        <div class="mfa-actions">
          <button type="button" class="secondary" id="mfaMethodCancelBtn">Cancel</button>
        </div>
      </div>

      <div id="mfaCodeStep" class="mfa-step">
        <div class="mfa-code-field">
          <label class="sr-only" for="mfaCode">Verification code</label>
          <input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter code" aria-describedby="mfaCodeError" />
          <div id="mfaCodeError" class="error">Enter the six-digit code to continue.</div>
        </div>
        <div class="mfa-actions">
          <button type="button" class="secondary" id="mfaCodeCancelBtn">Cancel</button>
          <button type="button" class="primary" id="verifyMfaBtn">Verify</button>
        </div>
      </div>

      <div id="staySignedInStep" class="stay-signed-in-step">
        <h2>Stay signed in?</h2>
        <p class="intro">Do this to reduce the number of times you sign in</p>
        <label class="checkbox-row" for="dontShowAgain">
          <input id="dontShowAgain" type="checkbox" />
          <span>Don't show this again</span>
        </label>
        <div class="stay-actions">
          <button type="button" class="secondary" id="stayNoBtn">No</button>
          <button type="button" class="primary" id="stayYesBtn">Yes</button>
        </div>
      </div>

      <div id="mockNote" class="mock-note" role="status"></div>
      <div class="divider"></div>
    </section>
  </main>

  <footer>
    <button class="footer-link" type="button" data-footer="Terms">Terms</button>
    <button class="footer-link" type="button" data-footer="Privacy & Cookies">Privacy &amp; Cookies</button>
    <span class="ellipsis" aria-hidden="true">...</span>
  </footer>

  <script>
    const emailStep = document.getElementById('emailStep');
    const passwordStep = document.getElementById('passwordStep');
    const mfaMethodStep = document.getElementById('mfaMethodStep');
    const mfaCodeStep = document.getElementById('mfaCodeStep');
    const staySignedInStep = document.getElementById('staySignedInStep');
    const productName = document.querySelector('.product-name');
    const signinTitle = document.getElementById('signin-title');
    const signinIntro = document.querySelector('.signin-shell > .intro');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const mfaCode = document.getElementById('mfaCode');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const mockNote = document.getElementById('mockNote');

    function showNote(message){
      mockNote.textContent = message;
      mockNote.classList.add('show');
    }
    function hideNote(){ mockNote.classList.remove('show'); }
    function isValidEmail(value){
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }
    function setSigninHeader(title, intro, identifier = 'FCTCIAM'){
      productName.style.display = 'block';
      productName.textContent = identifier;
      signinTitle.style.display = 'block';
      signinTitle.textContent = title;
      signinIntro.textContent = intro || '';
      signinIntro.style.display = intro ? 'block' : 'none';
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      hideNote();
      if(!isValidEmail(email.value.trim())){
        emailError.classList.add('show');
        email.focus();
        return;
      }
      emailError.classList.remove('show');
      emailStep.style.display = 'none';
      passwordStep.classList.add('show');
      password.focus();
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      hideNote();
      passwordStep.classList.remove('show');
      emailStep.style.display = 'block';
      setSigninHeader('Sign in', 'Sign in to access fctciam');
      email.focus();
    });

    document.getElementById('signInBtn').addEventListener('click', () => {
      hideNote();
      if(!password.value){
        passwordError.classList.add('show');
        password.focus();
        return;
      }
      passwordError.classList.remove('show');
      passwordStep.classList.remove('show');
      mfaMethodStep.classList.add('show');
      document.getElementById('emailCodeText').textContent = `Email code to ${email.value.trim()}`;
      setSigninHeader('Verify your identity', '', email.value.trim());
      document.getElementById('emailCodeBtn').focus();
    });

    document.getElementById('emailCodeBtn').addEventListener('click', () => {
      mfaMethodStep.classList.remove('show');
      mfaCodeStep.classList.add('show');
      setSigninHeader('Enter code', `We emailed a code to ${email.value.trim()}. Please enter the code to sign in.`, email.value.trim());
      mfaCode.focus();
    });

    document.getElementById('mfaMethodCancelBtn').addEventListener('click', () => {
      mfaMethodStep.classList.remove('show');
      passwordStep.classList.add('show');
      setSigninHeader('Sign in', 'Sign in to access fctciam');
      password.focus();
    });

    document.getElementById('mfaCodeCancelBtn').addEventListener('click', () => {
      document.getElementById('mfaCodeError').classList.remove('show');
      mfaCodeStep.classList.remove('show');
      mfaMethodStep.classList.add('show');
      setSigninHeader('Verify your identity', '', email.value.trim());
      document.getElementById('emailCodeBtn').focus();
    });

    document.getElementById('verifyMfaBtn').addEventListener('click', () => {
      const error = document.getElementById('mfaCodeError');
      if(!/^\d{6}$/.test(mfaCode.value.trim())){
        error.classList.add('show');
        mfaCode.focus();
        return;
      }
      error.classList.remove('show');
      mfaCodeStep.classList.remove('show');
      productName.style.display = 'none';
      signinTitle.style.display = 'none';
      signinIntro.style.display = 'none';
      staySignedInStep.classList.add('show');
      document.getElementById('dontShowAgain').focus();
    });

    document.getElementById('stayNoBtn').addEventListener('click', () => {
      showNote('Prototype only — continuing without staying signed in.');
    });

    document.getElementById('stayYesBtn').addEventListener('click', () => {
      window.location.href = 'product-selection.html';
    });

    document.getElementById('createAccount').addEventListener('click', () => {
      window.location.href = 'ciam-step-2.html';
    });

    document.querySelectorAll('[data-footer]').forEach(el => {
      el.addEventListener('click', () => showNote(el.dataset.footer + ' selected.'));
    });

    email.addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('nextBtn').click(); });
    password.addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('signInBtn').click(); });
    mfaCode.addEventListener('input', () => { mfaCode.value = mfaCode.value.replace(/\D/g, '').slice(0, 6); });
    mfaCode.addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('verifyMfaBtn').click(); });
  </script>
</body>
</html>
